<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petrol Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Petrol Calculator</h1>
        
        <div class="input-group">
            <label for="petrolPrice">Cost per liter (£):</label>
            <input type="number" id="petrolPrice" step="0.01" min="0" value="1.72" placeholder="Enter cost per liter">
        </div>
        
        <div class="input-group">
            <label for="liters">Number of liters:</label>
            <input type="number" id="liters" step="0.01" min="0" value="0" placeholder="Enter liters purchased">
        </div>
        
        <button id="calculateBtn">Calculate Total</button>
        
        <p id="result" class="result hidden">Total Cost: <span id="totalCost">£0.00</span></p>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
