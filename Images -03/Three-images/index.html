<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" type="text/css" />
    <title>Nature & Landscapes - Three Images</title>
</head>
<body>
    <h1>Landscape Photography</h1>
    <p>A beautiful collection of aerial nature images with natural filters</p>
    
    <div class="image-container">
        <div class="image-item">
            <img 
                src="image3.jpg" 
                alt="Aerial view of boats in a calm blue sea bay surrounded by mountains" 
                width="400" 
                height="300" 
                title="Boats in the Bay"
            />
            <p><strong>Serene Sea Bay</strong></p>
            <p class="license">Photo by eslames1 | License: Pexels Free to use</p>
        </div>

        <div class="image-item">
            <img 
                src="image2.jpg" 
                alt="Beautiful top-down drone shot of green agricultural fields and palm trees" 
                width="400" 
                height="300" 
                title="Green Fields and Palms"
            />
            <p><strong>Lush Green Fields</strong></p>
            <p class="license">Photo by eslames1 | License: Pexels Free to use</p>
        </div>

        <div class="image-item">
            <img 
                src="image1.jpg" 
                alt="Stunning aerial view of a mountain valley with a winding road and desert landscape" 
                width="400" 
                height="300" 
                title="Mountain Valley Road"
            />
            <p><strong>Mountain Valley Overview</strong></p>
            <p class="license">Photo by eslames1 | License: Pexels Free to use</p>
        </div>
    </div>
</body>
</html>
